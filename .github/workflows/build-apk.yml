name: Build StreamVault TV APK

on:
  push:
    branches: [ "main", "master", "standalone-accounts" ]
  pull_request:
    branches: [ "main", "master", "standalone-accounts" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate CI Keystore (if not supplied)
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore \
              -alias streamvault \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass streamvault2026 -keypass streamvault2026 \
              -dname "CN=StreamVault TV CI, OU=TV, O=StreamVault, L=Karachi, S=Sindh, C=PK"
          fi

      - name: Build Debug & Release APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-TV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-TV-Release-APK
          path: app/build/outputs/apk/release/*.apk
