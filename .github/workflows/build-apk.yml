name: Build StreamVault TV APK

on:
  push:
    branches: [ "main", "master", "standalone-accounts", "wip/**" ]
  pull_request:
    branches: [ "main", "master", "standalone-accounts" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22 (for the automated tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run all automated tests (a failing test stops the build)
        run: |
          npm ci
          npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Use the permanent signing key (if its secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Using the permanent signing key"
          fi

      - name: Generate CI Keystore (if not supplied)
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore \
              -alias streamvault \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass streamvault2026 -keypass streamvault2026 \
              -dname "CN=StreamVault TV CI, OU=TV, O=StreamVault, L=Karachi, S=Sindh, C=PK"
          fi

      - name: Run the Kotlin unit tests (catalog import, More Like This scoring)
        run: |
          chmod +x ./gradlew || true
          ./gradlew testDebugUnitTest --tests "com.streamvault.tv.*" --no-daemon

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-TV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-TV-Release-APK
          path: app/build/outputs/apk/release/*.apk
